name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backEnd/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backEnd/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backEnd
        run: |
          pytest backEnd/tests

  test-frontend:
    name: Frontend Quality & Build (SvelteKit 5 + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontEnd/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontEnd
        run: npm ci

      - name: Run Type & Svelte Check
        working-directory: frontEnd
        run: npm run check

      - name: Build SvelteKit Production Bundle
        working-directory: frontEnd
        run: npm run build

  preview-deployment:
    name: Preview Environment
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: https://gunners-arena.vercel.app
    steps:
      - name: Register Preview Environment
        run: echo "Preview environment verified and registered"

  production-deployment:
    name: Production Environment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://gunners-arena.vercel.app
    steps:
      - name: Register Production Environment
        run: echo "Production environment verified and registered"

