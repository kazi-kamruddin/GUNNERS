name: Football Data Ingestion Pipeline

on:
  schedule:
    # Runs twice daily at 06:00 and 18:00 UTC (cost-free on GitHub Actions)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      force_mock:
        description: 'Force curated baseline dataset (bypass external API)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: football-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Ingest Matches & Update Database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backEnd/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backEnd/requirements.txt

      - name: Execute Football Data Synchronization
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          PYTHONPATH: backEnd
        run: |
          if [ "${{ inputs.force_mock }}" = "true" ]; then
            python -m app.scripts.sync_football --mock
          else
            python -m app.scripts.sync_football
          fi
